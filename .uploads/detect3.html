<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>广东边界检测 v3</title>
<style>body{margin:0;background:#111;color:#eee;font-family:monospace}canvas{display:block;max-width:1024px;height:auto}div{padding:8px;font-size:13px;line-height:1.6;white-space:pre-line}</style>
</head>
<body>
<canvas id="c" width="1024" height="837"></canvas>
<div id="out"></div>
<script>
const img = new Image();
img.onload = () => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  ctx.drawImage(img, 0, 0);
  const W = 1024, H = 837;
  const id = ctx.getImageData(0,0,W,H);
  const data = id.data;
  const px = (x,y) => { const i=(y*W+x)*4; return [data[i],data[i+1],data[i+2],data[i+3]]; };
  
  // 分类像素
  // 1. 海洋: 浅蓝 (B>200, B>R+15)
  // 2. 广东陆地: 纯白 (R>245,G>245,B>245)
  // 3. 邻省: 浅灰 (R~230-245, 较均匀, 偏灰)
  // 4. 边界线: 深灰 (R<170)
  // 5. 河流: 蓝色线条
  
  const classify = (x,y) => {
    const [r,g,b,a] = px(x,y);
    if(a<128) return 'none';
    if(b>200 && b>r+15 && b>g+3 && r>165) return 'ocean';
    if(r>245 && g>245 && b>245) return 'white';   // 广东陆地或标题
    if(r<170 && g<170 && b<170) return 'line';     // 边界线/文字
    if(r>225 && g>225 && b>225) return 'gray';     // 邻省浅灰
    return 'other';
  };
  
  // 找海洋的边界(南海在底部)
  let oMinY=H, oMaxY=0, oMinX=W, oMaxX=0;
  for(let y=40;y<H-15;y++){
    for(let x=0;x<W;x++){
      if(classify(x,y)==='ocean'){
        if(y<oMinY)oMinY=y;
        if(y>oMaxY)oMaxY=y;
        if(x<oMinX)oMinX=x;
        if(x>oMaxX)oMaxX=x;
      }
    }
  }
  
  // 找广东陆地: 白色且被海洋包围/相邻(南海在南部)
  // 策略: 找每列最南的连续白色区域(广东南海岸线)
  // 广东陆地 = 白色 且 在海洋北侧
  const guangdongMask = new Uint8Array(W*H);
  for(let x=0;x<W;x++){
    // 找该列海洋的最北点
    let oceanTop=H;
    for(let y=40;y<H;y++){
      if(classify(x,y)==='ocean'){ oceanTop=y; break; }
    }
    // 广东陆地在海洋北侧的白色区域
    // 从oceanTop往上找连续白色
    for(let y=oceanTop-1;y>=40;y--){
      if(classify(x,y)==='white'){
        guangdongMask[y*W+x]=1;
      } else {
        // 邻省也较白,但广东陆地是连续的大块
        // 简单处理: 连续白色都算
        if(classify(x,y)==='gray') break;
        // 遇到边界线也停
      }
    }
  }
  
  // 这种方法不完美。换个思路:
  // 广东陆地 = 白色, 且该位置上下有海洋或河流
  // 用更简单: 广东陆地中心区域是白色大块, 在图像中下部
  
  // 统计每行白色像素分布(排除顶部标题区 y<50 和底部图例 y>760)
  const rowStats = [];
  for(let y=50;y<760;y++){
    let wc=0;
    for(let x=0;x<W;x++){
      if(classify(x,y)==='white') wc++;
    }
    rowStats.push({y,wc});
  }
  // 找白色像素最多的行(广东陆地最宽处, 即珠三角附近)
  rowStats.sort((a,b)=>b.wc-a.wc);
  const top10 = rowStats.slice(0,10);
  const medianY = top10.map(r=>r.y).sort((a,b)=>a-b)[5];
  
  // 在medianY行, 找连续白色段的左右边界(广东东西边界)
  let segs=[];
  let inSeg=false, segStart=0;
  for(let x=0;x<W;x++){
    const w = classify(x,medianY)==='white';
    if(w && !inSeg){ inSeg=true; segStart=x; }
    if(!w && inSeg){ segs.push([segStart,x-1]); inSeg=false; }
  }
  if(inSeg) segs.push([segStart,W-1]);
  segs.sort((a,b)=>(b[1]-b[0])-(a[1]-a[0]));
  const mainSeg = segs[0]||[0,0];
  
  // 类似找每列白色分布, 定上下边界
  const colStats=[];
  for(let x=mainSeg[0];x<=mainSeg[1];x++){
    let wc=0;
    for(let y=50;y<760;y++){
      if(classify(x,y)==='white') wc++;
    }
    colStats.push({x,wc});
  }
  colStats.sort((a,b)=>b.wc-a.wc);
  const medianX = colStats.length?colStats.map(r=>r.x).sort((a,b)=>a-b)[Math.floor(colStats.length/2)]:512;
  
  // 找该列白色段
  let vSegs=[];
  inSeg=false;
  for(let y=50;y<760;y++){
    const w=classify(medianX,y)==='white';
    if(w && !inSeg){inSeg=true;segStart=y;}
    if(!w && inSeg){vSegs.push([segStart,y-1]);inSeg=false;}
  }
  if(inSeg)vSegs.push([segStart,759]);
  vSegs.sort((a,b)=>(b[1]-b[0])-(a[1]-a[0]));
  const mainVSeg = vSegs[0]||[50,760];
  
  const out = document.getElementById('out');
  out.innerHTML = 
`海洋范围: minX=${oMinX}(${(oMinX/W*100).toFixed(1)}%) maxX=${oMaxX}(${(oMaxX/W*100).toFixed(1)}%) minY=${oMinY}(${(oMinY/H*100).toFixed(1)}%) maxY=${oMaxY}(${(oMaxY/H*100).toFixed(1)}%)
陆地最宽行(中位): y=${medianY}(${(medianY/H*100).toFixed(1)}%)
该行主白色段: x=[${mainSeg[0]}(${(mainSeg[0]/W*100).toFixed(1)}%), ${mainSeg[1]}(${(mainSeg[1]/W*100).toFixed(1)}%)] 宽=${mainSeg[1]-mainSeg[0]}
陆地最高列(中位): x=${medianX}(${(medianX/W*100).toFixed(1)}%)
该列主白色段: y=[${mainVSeg[0]}(${(mainVSeg[0]/H*100).toFixed(1)}%), ${mainVSeg[1]}(${(mainVSeg[1]/H*100).toFixed(1)}%)] 高=${mainVSeg[1]-mainVSeg[0]}`;
  
  // 画框
  ctx.strokeStyle='#22c55e'; ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,medianY);ctx.lineTo(W,medianY);ctx.stroke();
  ctx.strokeStyle='#ef4444'; ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(medianX,0);ctx.lineTo(medianX,H);ctx.stroke();
  ctx.strokeStyle='#facc15'; ctx.lineWidth=3;
  ctx.strokeRect(mainSeg[0],mainVSeg[0],mainSeg[1]-mainSeg[0],mainVSeg[1]-mainVSeg[0]);
};
img.src = '/src/assets/guangdong-map.png';
</script>
</body>
</html>
