<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preflight</title>
    <style id="theme-vars">
:root {
  --energy-bg: #0a0e1a;
  --energy-surface: #111827;
  --energy-surface-2: #1e293b;
  --energy-foreground: #f1f5f9;
  --energy-foreground-2: #94a3b8;
  --energy-foreground-3: #475569;
  --energy-brand: #06b6d4;
  --energy-brand-ink: #ecfeff;
  --energy-border: #1e293b;
  --energy-ring: #06b6d4;
  --energy-muted: #1e293b;
  --energy-muted-foreground: #94a3b8;
  --energy-card: #111827;
  --energy-card-foreground: #f1f5f9;
  --energy-popover: #111827;
  --energy-popover-foreground: #f1f5f9;
  --energy-input: #1e293b;
  --energy-primary: #06b6d4;
  --energy-primary-foreground: #ecfeff;
  --energy-radius-sm: 4px;
  --energy-radius-md: 8px;
  --energy-radius-lg: 16px;
  --energy-state-success: #22c55e;
  --energy-state-warning: #eab308;
  --energy-state-error: #ef4444;
  --energy-state-info: #06b6d4;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-foreground: var(--energy-foreground);
    --color-card: var(--energy-card);
    --color-card-foreground: var(--energy-card-foreground);
    --color-popover: var(--energy-popover);
    --color-popover-foreground: var(--energy-popover-foreground);
    --color-primary: var(--energy-primary);
    --color-primary-foreground: var(--energy-primary-foreground);
    --color-muted: var(--energy-muted);
    --color-muted-foreground: var(--energy-muted-foreground);
    --color-border: var(--energy-border);
    --color-input: var(--energy-input);
    --color-ring: var(--energy-ring);
    --color-background: var(--energy-bg);
    --radius-sm: var(--energy-radius-sm);
    --radius-md: var(--energy-radius-md);
    --radius-lg: var(--energy-radius-lg);
  }
  @layer base {
    body { background: var(--energy-bg); color: var(--energy-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-foreground { background-color: var(--energy-foreground); }
      .text-foreground { color: var(--energy-foreground); }
      .border-foreground { border-color: var(--energy-foreground); }
      .ring-foreground { --tw-ring-color: var(--energy-foreground); }
      .bg-card { background-color: var(--energy-card); }
      .text-card { color: var(--energy-card); }
      .border-card { border-color: var(--energy-card); }
      .ring-card { --tw-ring-color: var(--energy-card); }
      .bg-card-foreground { background-color: var(--energy-card-foreground); }
      .text-card-foreground { color: var(--energy-card-foreground); }
      .border-card-foreground { border-color: var(--energy-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--energy-card-foreground); }
      .bg-popover { background-color: var(--energy-popover); }
      .text-popover { color: var(--energy-popover); }
      .border-popover { border-color: var(--energy-popover); }
      .ring-popover { --tw-ring-color: var(--energy-popover); }
      .bg-popover-foreground { background-color: var(--energy-popover-foreground); }
      .text-popover-foreground { color: var(--energy-popover-foreground); }
      .border-popover-foreground { border-color: var(--energy-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--energy-popover-foreground); }
      .bg-primary { background-color: var(--energy-primary); }
      .text-primary { color: var(--energy-primary); }
      .border-primary { border-color: var(--energy-primary); }
      .ring-primary { --tw-ring-color: var(--energy-primary); }
      .bg-primary-foreground { background-color: var(--energy-primary-foreground); }
      .text-primary-foreground { color: var(--energy-primary-foreground); }
      .border-primary-foreground { border-color: var(--energy-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--energy-primary-foreground); }
      .bg-muted { background-color: var(--energy-muted); }
      .text-muted { color: var(--energy-muted); }
      .border-muted { border-color: var(--energy-muted); }
      .ring-muted { --tw-ring-color: var(--energy-muted); }
      .bg-muted-foreground { background-color: var(--energy-muted-foreground); }
      .text-muted-foreground { color: var(--energy-muted-foreground); }
      .border-muted-foreground { border-color: var(--energy-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--energy-muted-foreground); }
      .bg-border { background-color: var(--energy-border); }
      .text-border { color: var(--energy-border); }
      .border-border { border-color: var(--energy-border); }
      .ring-border { --tw-ring-color: var(--energy-border); }
      .bg-input { background-color: var(--energy-input); }
      .text-input { color: var(--energy-input); }
      .border-input { border-color: var(--energy-input); }
      .ring-input { --tw-ring-color: var(--energy-input); }
      .bg-ring { background-color: var(--energy-ring); }
      .text-ring { color: var(--energy-ring); }
      .border-ring { border-color: var(--energy-ring); }
      .ring-ring { --tw-ring-color: var(--energy-ring); }
      .bg-background { background-color: var(--energy-bg); }
      .text-background { color: var(--energy-bg); }
      .border-background { border-color: var(--energy-bg); }
      .ring-background { --tw-ring-color: var(--energy-bg); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
