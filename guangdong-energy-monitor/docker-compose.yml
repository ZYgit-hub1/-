# ============================================================================
# 广东省电厂监控平台 - Docker 本地联调环境
# 用法：docker-compose up -d
# ============================================================================
version: "3.9"

services:
  # ======================== PostgreSQL + PostGIS ========================
  postgres:
    image: postgis/postgis:15-3.3
    container_name: gd-energy-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: energy_monitor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/init-postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - energy-net

  # ======================== TDengine 3.x ========================
  tdengine:
    image: tdengine/tdengine:3.3.0.0
    container_name: gd-energy-tdengine
    restart: unless-stopped
    ports:
      - "6030:6030"   # Taos
      - "6041:6041"   # REST
      - "6043:6043"   # WebSocket
    environment:
      TZ: Asia/Shanghai
    volumes:
      - td_data:/var/lib/taos
      - ./docker/init-tdengine:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "taos", "-s", "SELECT server_version()"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - energy-net

  # ======================== Zookeeper ========================
  zookeeper:
    image: bitnami/zookeeper:3.8
    container_name: gd-energy-zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    volumes:
      - zk_data:/bitnami/zookeeper
    networks:
      - energy-net

  # ======================== Kafka ========================
  kafka:
    image: bitnami/kafka:3.6
    container_name: gd-energy-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_LOG_RETENTION_HOURS: 24
      KAFKA_CFG_LOG_RETENTION_BYTES: 536870912
    volumes:
      - kafka_data:/bitnami/kafka
    depends_on:
      zookeeper:
        condition: service_started
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - energy-net

  # ======================== Redis ========================
  redis:
    image: redis:7-alpine
    container_name: gd-energy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - energy-net

volumes:
  pg_data:
  td_data:
  zk_data:
  kafka_data:
  redis_data:

networks:
  energy-net:
    driver: bridge
