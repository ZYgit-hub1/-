openapi: 3.0.3
info:
  title: 广东省电厂监控平台 API 契约
  description: |
    华电集团广东电厂监控平台后端接口契约文档。
    所有接口统一通过 Gateway（8080）访问，需携带 JWT Token。
    所有响应统一使用 R<T> 包装结构。
    包含认证授权、用户管理、角色管理、组织架构、电厂管理、水文站管理、
    GIS 空间服务、报警管理、预警管理、规则管理、统计分析、预测服务、数据采集共13个控制器、54个REST端点。
  version: 1.0.0
  contact:
    name: 华电集团广东电厂监控平台研发组

servers:
  - url: http://localhost:8080
    description: 本地开发环境（Gateway 入口）
  - url: https://api.gd-energy.example.com
    description: 生产环境

security:
  - BearerAuth: []

tags:
  - name: 认证授权
    description: 用户登录、登出与Token刷新（AuthController）
  - name: 用户管理
    description: 用户增删改查（UserController）
  - name: 角色管理
    description: 角色增删改查（RoleController）
  - name: 组织架构
    description: 组织架构树形管理（OrgController）
  - name: 电厂管理
    description: 电厂基础信息与状态查询（PlantController）
  - name: 水文站管理
    description: 水文站信息管理（HydroStationController）
  - name: GIS 空间服务
    description: 地理信息系统空间查询（GisController）
  - name: 报警管理
    description: 报警查询、确认与处置（AlarmController）
  - name: 预警管理
    description: 预警信息查询与取消（WarningController）
  - name: 规则管理
    description: 报警规则重载与版本查询（RuleManageController）
  - name: 统计分析
    description: 首页看板与趋势分析（StatsController）
  - name: 预测服务
    description: 水位与发电量预测（PredictController）
  - name: 数据采集
    description: 气象、水文、应急数据采集（CollectorController）

paths:
  # ============================================================
  # 认证授权 (AuthController) - 3 endpoints
  # ============================================================
  /api/auth/login:
    post:
      tags: [认证授权]
      summary: 用户登录
      description: 用户名密码登录，返回 JWT Token
      security: []
      parameters:
        - name: username
          in: query
          required: true
          description: 用户名
          schema:
            type: string
        - name: password
          in: query
          required: true
          description: 密码
          schema:
            type: string
            format: password
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginVO'
        '401':
          description: 用户名或密码错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/R'

  /api/auth/logout:
    post:
      tags: [认证授权]
      summary: 用户登出
      description: 注销当前 Token，使其失效（Authorization 可选）
      responses:
        '200':
          description: 登出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/R'

  /api/auth/refreshToken:
    post:
      tags: [认证授权]
      summary: 刷新Token
      description: 使用当前 Token 获取新的 JWT Token（Authorization 可选）
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginVO'
        '402':
          description: Token 已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/R'

  # ============================================================
  # 用户管理 (UserController) - 5 endpoints
  # ============================================================
  /api/users:
    get:
      tags: [用户管理]
      summary: 用户列表（分页查询）
      description: 分页查询用户列表，支持关键字搜索
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: keyword
          in: query
          description: 用户名/姓名关键字
          schema:
            type: string
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PageResultSysUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [用户管理]
      summary: 新建用户
      description: 创建新用户
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SysUser'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SysUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [用户管理]
      summary: 更新用户
      description: 更新用户信息
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SysUser'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SysUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/users/{id}:
    get:
      tags: [用户管理]
      summary: 用户详情
      description: 根据用户ID查询详情
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginVO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [用户管理]
      summary: 删除用户
      description: 根据用户ID删除用户
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/R'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # 角色管理 (RoleController) - 5 endpoints
  # ============================================================
  /api/roles:
    get:
      tags: [角色管理]
      summary: 角色列表
      description: 查询所有角色列表
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SysRole'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [角色管理]
      summary: 新建角色
      description: 创建新角色
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SysRole'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SysRole'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [角色管理]
      summary: 更新角色
      description: 更新角色信息
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SysRole'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SysRole'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/roles/{id}:
    get:
      tags: [角色管理]
      summary: 角色详情
      description: 根据角色ID查询详情
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SysRole'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [角色管理]
      summary: 删除角色
      description: 根据角色ID删除角色
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/R'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # 组织架构 (OrgController) - 6 endpoints
  # ============================================================
  /api/orgs:
    get:
      tags: [组织架构]
      summary: 组织列表
      description: 查询所有组织列表（平铺）
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SysOrg'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [组织架构]
      summary: 新建组织
      description: 创建新组织节点
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SysOrg'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SysOrg'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [组织架构]
      summary: 更新组织
      description: 更新组织节点信息
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SysOrg'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SysOrg'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/orgs/tree:
    get:
      tags: [组织架构]
      summary: 组织树形结构
      description: 查询组织树形结构（带 children）
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SysOrg'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/orgs/{id}:
    get:
      tags: [组织架构]
      summary: 组织详情
      description: 根据组织ID查询详情
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SysOrg'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [组织架构]
      summary: 删除组织
      description: 根据组织ID删除组织节点
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/R'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # 电厂管理 (PlantController) - 6 endpoints
  # ============================================================
  /api/plants:
    get:
      tags: [电厂管理]
      summary: 电厂列表（分页查询）
      description: 支持按类型、状态、关键字分页查询电厂列表
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: type
          in: query
          description: 电厂类型
          schema:
            $ref: '#/components/schemas/PlantType'
        - name: status
          in: query
          description: 运行状态
          schema:
            $ref: '#/components/schemas/PlantStatus'
        - name: keyword
          in: query
          description: 名称关键字（模糊查询）
          schema:
            type: string
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PageResultPlant'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [电厂管理]
      summary: 新建电厂
      description: 创建一个新电厂
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Plant'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Plant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/plants/nearby:
    get:
      tags: [电厂管理]
      summary: 附近电厂
      description: 根据经纬度和半径查询附近电厂
      parameters:
        - name: lng
          in: query
          required: true
          description: 经度
          schema:
            type: number
            format: double
        - name: lat
          in: query
          required: true
          description: 纬度
          schema:
            type: number
            format: double
        - name: radius
          in: query
          required: true
          description: 搜索半径（公里）
          schema:
            type: number
            format: double
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Plant'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/plants/{id}:
    get:
      tags: [电厂管理]
      summary: 电厂详情
      description: 根据电厂ID查询详情
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Plant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [电厂管理]
      summary: 更新电厂
      description: 更新电厂信息
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Plant'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Plant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [电厂管理]
      summary: 删除电厂
      description: 根据电厂ID删除电厂
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/R'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # 水文站管理 (HydroStationController) - 5 endpoints
  # ============================================================
  /api/hydro/stations:
    get:
      tags: [水文站管理]
      summary: 水文站列表（分页）
      description: 查询水文站列表，支持按城市、河流、关键字分页筛选
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: city
          in: query
          description: 所属城市
          schema:
            type: string
        - name: river
          in: query
          description: 所属河流
          schema:
            type: string
        - name: keyword
          in: query
          description: 名称关键字
          schema:
            type: string
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PageResultHydroStation'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [水文站管理]
      summary: 新建水文站
      description: 创建新水文站
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HydroStation'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/HydroStation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/hydro/stations/{id}:
    get:
      tags: [水文站管理]
      summary: 水文站详情
      description: 根据水文站ID查询详情
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/HydroStation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/hydro/stations/by-city/{city}:
    get:
      tags: [水文站管理]
      summary: 按城市查询水文站
      description: 根据城市名称查询该城市下所有水文站
      parameters:
        - name: city
          in: path
          required: true
          description: 城市名称
          schema:
            type: string
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/HydroStation'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/hydro/stations/by-river/{river}:
    get:
      tags: [水文站管理]
      summary: 按河流查询水文站
      description: 根据河流名称查询该河流下所有水文站
      parameters:
        - name: river
          in: path
          required: true
          description: 河流名称
          schema:
            type: string
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/R'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
