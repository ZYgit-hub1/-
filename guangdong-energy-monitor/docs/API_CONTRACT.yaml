# ================================================================
# Components
# ================================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT Bearer Token 认证，登录后获取 token，请求头携带 Authorization: Bearer <token>"

  parameters:
    PageParam:
      name: page
      in: query
      description: 页码（从1开始）
      schema:
        type: integer
        minimum: 1
        default: 1

    SizeParam:
      name: size
      in: query
      description: 每页条数
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    IdParam:
      name: id
      in: path
      required: true
      description: 主键ID
      schema:
        type: integer
        format: int64

  responses:
    BadRequest:
      description: 请求参数错误（400 PARAM_ERROR）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/R'
    Unauthorized:
      description: 未认证或Token无效（401 UNAUTHORIZED）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/R'
    TokenExpired:
      description: Token已过期（402 TOKEN_EXPIRED）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/R'
    Forbidden:
      description: 无权限访问（403 FORBIDDEN）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/R'
    NotFound:
      description: 资源不存在（404 NOT_FOUND）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/R'
    InternalError:
      description: 服务器内部错误（500 SYSTEM_ERROR）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/R'

  schemas:
    # --------------------------------------------------------
    # 统一响应包装 R<T>
    # --------------------------------------------------------
    R:
      type: object
      description: |
        统一响应包装结构 R<T>。
        错误码：200 SUCCESS, 400 PARAM_ERROR, 401 UNAUTHORIZED,
        402 TOKEN_EXPIRED, 403 FORBIDDEN, 404 NOT_FOUND,
        500 BUSINESS_ERROR, 5000 SYSTEM_ERROR
      properties:
        code:
          type: integer
          description: 业务状态码
          example: 200
        msg:
          type: string
          description: 提示信息
          example: 操作成功
        data:
          description: 业务数据（具体结构见各接口）
          nullable: true

    # --------------------------------------------------------
    # 分页结果 PageResult<T>
    # --------------------------------------------------------
    PageResult:
      type: object
      description: 分页结果通用结构 PageResult<T>
      properties:
        list:
          type: array
          description: 数据列表
          items: {}
        total:
          type: integer
          format: int64
          description: 总记录数
        page:
          type: integer
          description: 当前页码
        size:
          type: integer
          description: 每页条数

    PageResultSysUser:
      allOf:
        - $ref: '#/components/schemas/PageResult'
        - type: object
          properties:
            list:
              type: array
              items:
                $ref: '#/components/schemas/SysUser'

    PageResultPlant:
      allOf:
        - $ref: '#/components/schemas/PageResult'
        - type: object
          properties:
            list:
              type: array
              items:
                $ref: '#/components/schemas/Plant'

    PageResultHydroStation:
      allOf:
        - $ref: '#/components/schemas/PageResult'
        - type: object
          properties:
            list:
              type: array
              items:
                $ref: '#/components/schemas/HydroStation'

    PageResultAlarm:
      allOf:
        - $ref: '#/components/schemas/PageResult'
        - type: object
          properties:
            list:
              type: array
              items:
                $ref: '#/components/schemas/Alarm'

    PageResultWarning:
      allOf:
        - $ref: '#/components/schemas/PageResult'
        - type: object
          properties:
            list:
              type: array
              items:
                $ref: '#/components/schemas/Warning'

    # --------------------------------------------------------
    # 认证与用户
    # --------------------------------------------------------
    LoginVO:
      type: object
      description: 登录返回视图对象
      properties:
        token:
          type: string
          description: JWT Token
        userId:
          type: integer
          format: int64
          description: 用户ID
        username:
          type: string
          description: 用户名
        realName:
          type: string
          description: 真实姓名
        roles:
          type: array
          description: 角色列表
          items:
            $ref: '#/components/schemas/UserRole'
        permissions:
          type: array
          description: 权限标识列表
          items:
            type: string

    SysUser:
      type: object
      description: 系统用户
      properties:
        id:
          type: integer
          format: int64
          description: 主键
        username:
          type: string
          description: 用户名
        realName:
          type: string
          description: 真实姓名
        phone:
          type: string
          description: 手机号
        email:
          type: string
          description: 邮箱
        orgId:
          type: integer
          format: int64
          description: 所属组织ID
        status:
          type: integer
          description: 状态（0禁用 1启用）
        createTime:
          type: string
          format: date-time
          description: 创建时间
        updateTime:
          type: string
          format: date-time
          description: 更新时间

    # --------------------------------------------------------
    # 角色
    # --------------------------------------------------------
    SysRole:
      type: object
      description: 系统角色
      properties:
        id:
          type: integer
          format: int64
          description: 主键
        name:
          type: string
          description: 角色名称
        code:
          type: string
          description: 角色编码
        description:
          type: string
          description: 角色描述
        createTime:
          type: string
          format: date-time
          description: 创建时间

    # --------------------------------------------------------
    # 组织架构
    # --------------------------------------------------------
    SysOrg:
      type: object
      description: 组织架构（支持树形结构，带 children）
      properties:
        id:
          type: integer
          format: int64
          description: 主键
        parentId:
          type: integer
          format: int64
          description: 父级ID
        name:
          type: string
          description: 组织名称
        code:
          type: string
          description: 组织编码
        sort:
          type: integer
          description: 排序号
        createTime:
          type: string
          format: date-time
          description: 创建时间
        children:
          type: array
          description: 子组织列表
          items:
            $ref: '#/components/schemas/SysOrg'

    # --------------------------------------------------------
    # 电厂
    # --------------------------------------------------------
    Plant:
      type: object
      description: 电厂信息
      properties:
        id:
          type: integer
          format: int64
          description: 主键
        name:
          type: string
          description: 电厂名称
          example: 华电广州燃煤电厂
        type:
          $ref: '#/components/schemas/PlantType'
        lng:
          type: number
          format: double
          description: 经度
          example: 113.264385
        lat:
          type: number
          format: double
          description: 纬度
          example: 23.129112
        capacity:
          type: number
          format: double
          description: 装机容量（MW）
          example: 600.00
        status:
          $ref: '#/components/schemas/PlantStatus'
        address:
          type: string
          description: 详细地址
        createTime:
          type: string
          format: date-time
          description: 创建时间
        updateTime:
          type: string
          format: date-time
          description: 更新时间

    # --------------------------------------------------------
    # 水文站
    # --------------------------------------------------------
    HydroStation:
      type: object
      description: 水文站信息
      properties:
        id:
          type: integer
          format: int64
          description: 主键
        name:
          type: string
          description: 水文站名称
          example: 北江石角水文站
        riverBasin:
          type: string
          description: 所属流域/河流
          example: 北江
        lng:
          type: number
          format: double
          description: 经度
        lat:
          type: number
          format: double
          description: 纬度
        warningLevel:
          type: number
          format: double
          description: 警戒水位（m）
        guaranteeLevel:
          type: number
          format: double
          description: 保证水位（m）
        historicalMax:
          type: number
          format: double
          description: 历史最高水位（m）
        flowCapacity:
          type: number
          format: double
          description: 流量容量（m³/s）
        city:
          type: string
          description: 所属城市
          example: 清远
        status:
          type: integer
          description: 状态
        createTime:
          type: string
          format: date-time
          description: 创建时间
        updateTime:
          type: string
          format: date-time
          description: 更新时间

    # --------------------------------------------------------
    # 报警
    # --------------------------------------------------------
    Alarm:
      type: object
      description: 报警信息
      properties:
        id:
          type: integer
          format: int64
          description: 主键
        level:
          type: string
          description: 报警级别
          enum: [emergency, high, medium, low]
        status:
          type: string
          description: 处置状态
          enum: [unconfirmed, confirmed, resolved]
        content:
          type: string
          description: 报警内容
          example: 1号机组主变压器温度超限（85℃）
        plantId:
          type: integer
          format: int64
          description: 关联电厂ID
        plantName:
          type: string
          description: 关联电厂名称
        triggerTime:
          type: string
          format: date-time
          description: 触发时间
        confirmTime:
          type: string
          format: date-time
          description: 确认时间
          nullable: true
        resolveTime:
          type: string
          format: date-time
          description: 处理完成时间
          nullable: true
        handler:
          type: string
          description: 处理人
          nullable: true
        remark:
          type: string
          description: 处理备注
          nullable: true
        createTime:
          type: string
          format: date-time
          description: 创建时间

    # --------------------------------------------------------
    # 预警
    # --------------------------------------------------------
    Warning:
      type: object
      description: 预警信息
      properties:
        id:
          type: integer
          format: int64
          description: 主键
        level:
          $ref: '#/components/schemas/WarningLevel'
        type:
          $ref: '#/components/schemas/WeatherWarningType'
        content:
          type: string
          description: 预警内容
        plantId:
          type: integer
          format: int64
          description: 关联电厂ID
        plantName:
          type: string
          description: 关联电厂名称
        startTime:
          type: string
          format: date-time
          description: 预警开始时间
        endTime:
          type: string
          format: date-time
          description: 预警结束时间
        status:
          type: string
          description: 状态
          enum: [active, expired, cancelled]
        createTime:
          type: string
          format: date-time
          description: 创建时间

    # --------------------------------------------------------
    # 气象数据
    # --------------------------------------------------------
    WeatherData:
      type: object
      description: 气象数据
      properties:
        id:
          type: integer
          format: int64
          description: 主键
        plantId:
          type: integer
          format: int64
          description: 电厂ID
        temp:
          type: number
          format: double
          description: 温度（℃）
        humidity:
          type: number
          format: double
          description: 湿度（%）
        windSpeed:
          type: number
          format: double
          description: 风速（m/s）
        windDirection:
          type: string
          description: 风向
        rainfall:
          type: number
          format: double
          description: 降雨量（mm）
        recordTime:
          type: string
          format: date-time
          description: 记录时间

    # --------------------------------------------------------
    # 水文数据
    # --------------------------------------------------------
    HydroData:
      type: object
      description: 水文数据
      properties:
        id:
          type: integer
          format: int64
          description: 主键
        stationId:
          type: integer
          format: int64
          description: 水文站ID
        waterLevel:
          type: number
          format: double
          description: 水位（m）
        flowRate:
          type: number
          format: double
          description: 流量（m³/s）
        trend:
          type: string
          description: 水位趋势
          enum: [rising, falling, steady]
        alertLevel:
          type: string
          description: 告警等级
          enum: [normal, watch, warning, flood]
        readingTime:
          type: string
          format: date-time
          description: 读数时间

    # --------------------------------------------------------
    # 应急事件
    # --------------------------------------------------------
    EmergencyEvent:
      type: object
      description: 应急事件
      properties:
        id:
          type: integer
          format: int64
          description: 主键
        type:
          type: string
          description: 事件类型
        level:
          type: string
          description: 事件等级
        title:
          type: string
          description: 事件标题
        content:
          type: string
          description: 事件内容
        location:
          type: string
          description: 事件地点
        lng:
          type: number
          format: double
          description: 经度
        lat:
          type: number
          format: double
          description: 纬度
        occurTime:
          type: string
          format: date-time
          description: 发生时间
        status:
          type: string
          description: 状态

    # --------------------------------------------------------
    # 仪表盘
    # --------------------------------------------------------
    DashboardVO:
      type: object
      description: 首页统计看板视图对象
      properties:
        totalPlants:
          type: integer
          description: 电厂总数
        normalCount:
          type: integer
          description: 正常电厂数
        warningCount:
          type: integer
          description: 预警电厂数
        dangerCount:
          type: integer
          description: 危险电厂数
        offlineCount:
          type: integer
          description: 离线电厂数
        totalAlarms:
          type: integer
          description: 报警总数
        activeWarnings:
          type: integer
          description: 活跃预警数
        hydroStationCount:
          type: integer
          description: 水文站总数
        hydroAlertCount:
          type: integer
          description: 水文告警数

    # --------------------------------------------------------
    # 趋势分析
    # --------------------------------------------------------
    PlantTrendVO:
      type: object
      description: 电厂趋势分析（时间序列格式）
      properties:
        plantId:
          type: integer
          format: int64
          description: 电厂ID
        plantName:
          type: string
          description: 电厂名称
        dates:
          type: array
          description: 时间序列
          items:
            type: string
            format: date-time
        values:
          type: array
          description: 数值序列
          items:
            type: number
            format: double
        metric:
          type: string
          description: 指标类型

    # --------------------------------------------------------
    # 统计项
    # --------------------------------------------------------
    StatItem:
      type: object
      description: 统计项
      properties:
        label:
          type: string
          description: 标签
        value:
          type: number
          format: double
          description: 数值
        color:
          type: string
          description: 显示颜色

    # --------------------------------------------------------
    # 预测响应
    # --------------------------------------------------------
    PredictionResponseDTO:
      type: object
      description: 预测服务响应
      properties:
        predictType:
          type: string
          description: 预测类型（water_level / power）
        targetId:
          type: integer
          format: int64
          description: 目标ID（水文站ID或电厂ID）
        forecastTimes:
          type: array
          description: 预测时间序列
          items:
            type: string
            format: date-time
        forecastValues:
          type: array
          description: 预测值序列
          items:
            type: number
            format: double
        upperBound:
          type: array
          description: 置信上界
          items:
            type: number
            format: double
        lowerBound:
          type: array
          description: 置信下界
          items:
            type: number
            format: double
        confidence:
          type: number
          format: double
          description: 置信度（0~1）
        modelUsed:
          type: string
          description: 使用的模型
        fallback:
          type: boolean
          description: 是否使用降级策略
        generatedAt:
          type: string
          format: date-time
          description: 预测生成时间

    # --------------------------------------------------------
    # 时间序列数据
    # --------------------------------------------------------
    TimeSeriesData:
      type: object
      description: 时间序列数据通用格式
      properties:
        times:
          type: array
          description: 时间戳序列
          items:
            type: string
            format: date-time
        values:
          type: array
          description: 数值序列
          items:
            type: number
        unit:
          type: string
          description: 单位

    # --------------------------------------------------------
    # 枚举类型
    # --------------------------------------------------------
    UserRole:
      type: string
      description: 用户角色
      enum:
        - ADMIN
        - PROD_SAFETY
        - PLANT_MANAGER
        - OPERATOR

    PlantType:
      type: string
      description: 电厂类型
      enum:
        - coal
        - gas
        - solar
        - wind
        - storage

    PlantStatus:
      type: string
      description: 电厂运行状态
      enum:
        - normal
        - warning
        - danger
        - offline

    WarningLevel:
      type: string
      description: 预警级别
      enum:
        - blue
        - yellow
        - orange
        - red

    WeatherWarningType:
      type: string
      description: 预警类型
      enum:
        - typhoon
        - rainstorm
        - high_temp
        - low_temp
        - gale
        - fog
        - haze
        - thunder
        - ice
        - drought
        - flood
        - other

    AlertRuleType:
      type: string
      description: 报警规则类型
      enum:
        - hydro
        - weather
        - fire
        - equipment
        - composite

    RuleLogicType:
      type: string
      description: 规则逻辑类型
      enum:
        - static_threshold
        - dynamic_deviation
        - combo_logic
        - trend_warning

    # --------------------------------------------------------
    # GeoJSON FeatureCollection（GIS 空间服务）
    # --------------------------------------------------------
    GeoJSONFeatureCollection:
      type: object
      description: GeoJSON FeatureCollection 基础结构
      required:
        - type
        - features
      properties:
        type:
          type: string
          enum: [FeatureCollection]
        features:
          type: array
          items:
            $ref: '#/components/schemas/GeoJSONFeature'

    GeoJSONFeature:
      type: object
      description: GeoJSON Feature
      required:
        - type
        - geometry
        - properties
      properties:
        type:
          type: string
          enum: [Feature]
        geometry:
          $ref: '#/components/schemas/GeoJSONGeometry'
        properties:
          type: object
          additionalProperties: true

    GeoJSONGeometry:
      type: object
      description: GeoJSON Geometry
      required:
        - type
        - coordinates
      properties:
        type:
          type: string
          enum: [Point, MultiPoint, LineString, MultiLineString, Polygon, MultiPolygon]
        coordinates:
          type: array
          items: {}

    PlantFeatureCollection:
      allOf:
        - $ref: '#/components/schemas/GeoJSONFeatureCollection'
        - type: object
          description: 电厂 GeoJSON FeatureCollection，properties 包含 Plant 全部字段
          properties:
            features:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/GeoJSONFeature'
                  - type: object
                    properties:
                      properties:
                        type: object
                        properties:
                          id:
                            type: integer
                            format: int64
                          name:
                            type: string
                          type:
                            $ref: '#/components/schemas/PlantType'
                          lng:
                            type: number
                            format: double
                          lat:
                            type: number
                            format: double
                          capacity:
                            type: number
                            format: double
                          status:
                            $ref: '#/components/schemas/PlantStatus'
                          address:
                            type: string

    HydroStationFeatureCollection:
      allOf:
        - $ref: '#/components/schemas/GeoJSONFeatureCollection'
        - type: object
          description: 水文站 GeoJSON FeatureCollection，properties 包含 HydroStation 全部字段
          properties:
            features:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/GeoJSONFeature'
                  - type: object
                    properties:
                      properties:
                        type: object
                        properties:
                          id:
                            type: integer
                            format: int64
                          name:
                            type: string
                          riverBasin:
                            type: string
                          lng:
                            type: number
                            format: double
                          lat:
                            type: number
                            format: double
                          warningLevel:
                            type: number
                            format: double
                          guaranteeLevel:
                            type: number
                            format: double
                          historicalMax:
                            type: number
                            format: double
                          flowCapacity:
                            type: number
                            format: double
                          city:
                            type: string
                          status:
                            type: integer
