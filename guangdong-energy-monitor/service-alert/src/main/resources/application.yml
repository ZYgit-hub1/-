server:
  port: 8084

spring:
  application:
    name: alert-service
  profiles:
    active: dev

  # ==================== 数据源（Druid） ====================
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/energy_monitor_alert?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=1000
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        reset-enable: false
        login-username: admin
        login-password: admin

  # ==================== Redis ====================
  data:
    redis:
      host: localhost
      port: 6379
      database: 4
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 5000ms

  # ==================== Kafka ====================
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      # 发送失败重试次数
      retries: 3
      # 批量发送大小（字节）
      batch-size: 16384
      # 缓冲区大小
      buffer-memory: 33554432
      # acks：all 表示所有副本确认
      acks: all
      key-serializer: org.springframework.kafka.support.serializer.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: alert-service-group
      # earliest：无提交 offset 时从最早开始消费
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 500
      key-deserializer: org.springframework.kafka.support.serializer.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        # 信任内部 DTO 包
        spring.json.trusted.packages: "com.huadianguangdong.*"
    listener:
      # 手动提交，配合 RECORD ack 模式
      ack-mode: MANUAL_IMMEDIATE
      concurrency: 3

  # ==================== Jackson ====================
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# ==================== MyBatis-Plus ====================
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.huadianguangdong.alert.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ==================== Drools 规则引擎 ====================
drools:
  rules:
    # 规则文件扫描路径（classpath 下）
    path: rules/
    # 是否在启动时编译校验规则
    validate-on-startup: true

# ==================== Springdoc OpenAPI ====================
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.huadianguangdong.alert.controller

# ==================== 服务暴露（Actuator 简化） ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.huadianguangdong: DEBUG
    com.alibaba.druid: INFO
    org.drools: INFO
