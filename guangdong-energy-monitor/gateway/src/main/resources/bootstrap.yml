spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        file-extension: yaml
        # 共享公共配置
        shared-configs:
          - data-id: application-common.yml
            refresh: true
